name: GNSS RTCM Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  rtcm-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyrtcm

      - name: Run RTCM monitor
        env:
          NTRIP_HOST: ${{ secrets.NTRIP_HOST }}
          NTRIP_PORT: ${{ secrets.NTRIP_PORT }}
          MOUNTPOINT: ${{ secrets.MOUNTPOINT }}
          NTRIP_USERNAME: ${{ secrets.NTRIP_USERNAME }}
          NTRIP_PASSWORD: ${{ secrets.NTRIP_PASSWORD }}
          GGA_FILE: gga_log.csv
          RTCM_FILE: rtcm_live_log.csv
          GGA_INTERVAL: "1"
          PUBLISH_INTERVAL: "60"
          MAX_ROWS: "1000"
          RECONNECT_DELAY: "10"
        run: |
          timeout 7m python cloud_rtcm_monitor.py || true

      - name: Commit latest RTCM data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rtcm_live_log.csv
          git diff --cached --quiet || git commit -m "Update live RTCM data"
          git push
          
